<script language="JavaScript">
function winopen(event) {
    // Mencegah perilaku default tautan agar bisa dikendalikan dengan aman
    event.preventDefault();

    // Membuka jendela baru
    var OW = window.open("https://www.google.com.hk/", "newwin");
    
    if (OW) {
        OW.document.write("<TITLE>Google</TITLE>");
        OW.document.write("<h1>The Phishing Page !!</h1>");
        OW.document.close();

        // Contoh: Jika ingin menutup popup tersebut setelah 4 detik
        setTimeout(() => {
            try {
                OW.close();
            } catch (err) {
                console.warn("Gagal menutup popup:", err);
            }
        }, 4000);
    }
}
</script>

<a href="https://www.google.com.hk/" target="newwin" onclick="winopen(event)">Google Home Page</a>
