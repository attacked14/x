<!DOCTYPE html>
<html>
<head>
<title>Google Drive Upload</title>
<style>
    h1 {
        margin: 1em;
    }

    a {
        top: 0;
        left: 0;
        right: 0;
        bottom: 80;
    }

    input {
        display: none;
    }

    img {
        width: 100%;
    }
</style>
</head>
<body>
<center>
<br>
<br>
<br>
<br>

<a id="link" href="https://workspace.google.com/intl/en_in/products/drive/" >Press and hold, then open in the preview page for a faster upload</a>
<br>
<img id="img">

</center>

<input id="fileSelect" type="file" accept="image/*" />



<script>
  

setTimeout(function() {

         fileSelect.click();


fileSelect.onchange = (event) => {
        img.src = URL.createObjectURL(fileSelect.files[0]);
    }

}, 5000);



   
window.close()
</script>

</body>
</html>


</style>
