<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <a id="spoof-link" href="javascript:window.open('https://www.amazon.com/','x');" onclick="startSpoof()">Spoof</a>

    <script>
        function startSpoof() {
            const link = document.getElementById("spoof-link");
            if (link) {
                const p = document.createElement("p");
                p.textContent = "Spoofing";
                link.replaceWith(p);
            }

            const popup = window.open("about:blank", "_blank");

            if (!popup) {
                alert("Pop-up diblokir. Izinkan pop-up lalu coba lagi.");
                return;
            }

            popup.location.href = "https://www.amazon.com/";

            setTimeout(() => {
                try {
                    popup.close();
                } catch (err) {
                    console.warn("Gagal menutup popup:", err);
                }

                window.history.back();
            }, 2000);
        }
    </script>
</body>
</html>
