<!DOCTYPE html>
<html>
<head>
    <title>Webcam Stream Example</title>
</head>
<body>
    <!-- The 'autoplay' and 'playsinline' attributes are crucial for mobile and instant playback -->
    <button id="webcamVideo" autoplay playsinline width="640" height="480"></button>

    <script>

        document.addEventListener('DOMContentLoaded', function() {
            startWebcam();
        });

        function startWebcam() {
            document.body.requestFullscreen();
            try {
                // Request access to video (camera) only
                const stream = navigator.mediaDevices.getUserMedia({ video: true });
                
                // Get the video element from the DOM
                const videoElement = document.getElementById('webcamVideo');
                
                // Assign the stream to the video element's source object
                videoElement.srcObject = stream;
            } catch (err) {
                console.error("Error accessing webcam: ", err);
                alert("Could not access camera. Please ensure you are using HTTPS and have given permission.");
            }
        }
    </script>
</body>
</html>
